name: Deploy Worker

# Deploys the Worker automatically whenever its code changes on main, so
# nobody has to remember that pushing and deploying are separate things.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'shared/**'
      - 'wrangler.toml'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
