# Runs a member's /update scan.
#
# Triggered by the Cloudflare Worker via repository_dispatch when someone runs
# /update in Discord. The Worker replies instantly with "queued", this job does
# the slow part, then edits that same message with the result.
#
# It lives here rather than in the Worker because a full scan makes hundreds of
# PSN calls over several minutes, and Cloudflare's free tier caps a Worker at
# 50 subrequests per invocation.

name: Trophy scan

on:
  repository_dispatch:
    types: [trophy-scan]
  workflow_dispatch:
    inputs:
      discord_id:
        description: Discord user id to scan
        required: true

concurrency:
  # One scan at a time SERVER-WIDE. Every scan logs in as the same PSN account,
  # so parallel jobs each get their own rate limiter and collectively blow past
  # Sony's limit. queue: max keeps the others waiting in order rather than
  # letting GitHub cancel all but the most recent.
  group: psn-scan
  cancel-in-progress: false
  queue: max

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - name: Run scan
        env:
          TARGET_DISCORD_ID: ${{ github.event.client_payload.discord_id || inputs.discord_id }}
          INTERACTION_TOKEN: ${{ github.event.client_payload.interaction_token }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_UPDATES_CHANNEL_ID: ${{ vars.DISCORD_UPDATES_CHANNEL_ID }}
          DISCORD_LEADERBOARD_CHANNEL_ID: ${{ vars.DISCORD_LEADERBOARD_CHANNEL_ID }}
          DISCORD_OWNER_ID: ${{ vars.DISCORD_OWNER_ID }}
        run: npm run scan
