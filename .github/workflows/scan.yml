  # The FAST lane — repeat updates.
#
# Two workflows scan trophies, and the only differences are the concurrency
# group, the timeout and the PSN rate budget. They exist as separate files
# because GitHub concurrency groups are per workflow: two files is what actually
# buys two independent queues.
#
#   scan.yml        this one. Repeat updates. 2-4 minutes.
#   scan-first.yml  first scans, and repeat updates when this lane is busy and
#                   that one is idle — so neither lane ever sits doing nothing.
#
# Why bother: every scan logs in as the same PSN account, so they cannot all run
# at once. With one queue, a newcomer's three-hour first scan sits in front of
# everyone who just wants to refresh — and with ~100 people arriving, all of
# them needing a first scan, that queue is days long. Person number sixty is
# told they are sixtieth and leaves.
#
# The Worker chooses the lane (see laneFor() in worker/src/index.mjs) and fires
# the matching event type. Nobody picks by hand.

name: Trophy scan

on:
  repository_dispatch:
    types: [trophy-scan]
  workflow_dispatch:
    inputs:
      discord_id:
        description: Discord user id to scan (use "Trophy scan (first)" for anyone who has never been scanned)
        required: true

concurrency:
  group: psn-scan-fast
  cancel-in-progress: false
  queue: max

jobs:
  scan:
    runs-on: ubuntu-latest
    # A repeat update touches only games whose trophy count actually moved, plus
    # a capped background refresh. If one runs an hour, it is stuck, and it must
    # not hold the fast queue any longer than that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - name: Run scan
        env:
          TARGET_DISCORD_ID: ${{ github.event.client_payload.discord_id || inputs.discord_id }}
          INTERACTION_TOKEN: ${{ github.event.client_payload.interaction_token }}
          # THE TWO LANES SHARE SONY'S BUDGET, they do not each get their own.
          # A single scan used to run at 600 requests per 15 minutes; two lanes
          # at 600 would be 1,200, well past the ~840 the original Nahasis bot
          # sustained for years. 200 here + 450 in scan-first.yml = 650 total,
          # comfortably under it. Repeat updates need very few calls, so the
          # smaller share costs nothing.
          PSN_RATE_LIMIT: 200
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_UPDATES_CHANNEL_ID: ${{ vars.DISCORD_UPDATES_CHANNEL_ID }}
          DISCORD_LEADERBOARD_CHANNEL_ID: ${{ vars.DISCORD_LEADERBOARD_CHANNEL_ID }}
          DISCORD_OWNER_ID: ${{ vars.DISCORD_OWNER_ID }}
        run: npm run scan
