name = "platinum-intel"
main = "worker/src/index.mjs"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# The Discord interactions endpoint. Free tier is 100,000 requests/day — a few
# hundred members running slash commands uses a rounding error of that.
#
# Note the heavy work does NOT live here: a full trophy scan makes hundreds of
# outbound calls and the free tier caps a Worker at 50 per invocation, so
# /update dispatches to GitHub Actions instead.

[[d1_databases]]
binding = "DB"
database_name = "platinum-intel"
database_id = "44d2a77b-cded-4a63-af05-dc43da8aaed6"

[vars]
# Public, non-secret configuration. Secrets go in via `wrangler secret put`.

# Set this to a Discord role id to gate /register during the soft launch.
# Only members with the role can join the board; leave empty to open it up.
HUNTER_ROLE_ID = "1538606682039648327"

# The #leaderboard channel and the server it lives in. Only used to build the
# "Open #leaderboard" link on /leaderboard, so the private peek can hand you
# back to the pinned board. Both are needed or the button is simply omitted.
DISCORD_GUILD_ID = "1351956287222714389"
DISCORD_LEADERBOARD_CHANNEL_ID = "1539046348496838686"

# How many members per page on /leaderboard. Was 10 when each row was a card;
# rows are single lines now, so 25 fits comfortably inside Discord's 4,000
# character ceiling with room to spare.
LEADERBOARD_PAGE_SIZE = "25"

# Public base URL of this Worker. Used to build the "Link with Discord"
# verification link, so it must match what is configured in the Discord
# developer portal — the Redirect URI there is this value plus /auth/callback.
WORKER_BASE_URL = "https://platinum-intel.martinleewilkinson1992.workers.dev"

# Secrets required (set with: wrangler secret put NAME)
#   DISCORD_PUBLIC_KEY      - from the Discord app's General Information page
#   DISCORD_APPLICATION_ID  - same page
#   DISCORD_CLIENT_SECRET   - OAuth2 page of the same app. Only needed for the
#                             "Link with Discord" verification route. Add
#                             <WORKER_BASE_URL>/auth/callback as a Redirect URI
#                             on that page too, or Discord refuses the flow.
#   GITHUB_TOKEN            - fine-grained PAT with "Contents: read and write"
#   GITHUB_REPO             - e.g. "martin/platinum-intel"

# Worker logs. Off by default, which means the first time something goes wrong
# in production there is nothing to read — you turn it on, then have to
# reproduce the fault. Cheap enough to leave on: 20 million log events are
# included, and this Worker serves a few hundred requests a month.
#
# Set here rather than in the dashboard because `wrangler deploy` overwrites
# dashboard observability settings with whatever this file says — so a dashboard
# toggle would silently switch itself back off on the next push.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
